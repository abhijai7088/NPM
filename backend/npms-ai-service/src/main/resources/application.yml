server:
  port: 8087
spring:
  application:
    name: npms-ai-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:npms_db}
    username: ${DB_USER:npms_user}
    password: ${DB_PASSWORD:npms_local_pass_2026}
  jpa:
    hibernate.ddl-auto: validate
    properties.hibernate.default_schema: ai
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  security:
    filter:
      order: 10
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
