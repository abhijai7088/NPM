server:
  port: 8080
spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates: [Path=/api/v1/auth/**]
        - id: master-service
          uri: http://localhost:8082
          predicates: [Path=/api/v1/master/**]
        - id: core-service
          uri: http://localhost:8083
          predicates: [Path=/api/v1/core/**]
